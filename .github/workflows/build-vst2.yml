name: Build with VST2 (manual)

# VST2 cannot be redistributed by Steinberg's current license, so the SDK is NOT part of this repo.
# If you own a VST2 license: put the SDK in a folder named "vst2sdk" in a PRIVATE copy of this repo
# (so that vst2sdk/pluginterfaces/vst2.x/aeffect.h exists), then run this workflow from the Actions tab.
# JUCE 8 removed the VST2 wrapper, so this workflow builds against JUCE 7.0.12.

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-22.04
            name: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check VST2 SDK
        shell: bash
        run: test -f vst2sdk/pluginterfaces/vst2.x/aeffect.h || (echo "vst2sdk folder missing - see comment at top of this workflow" && exit 1)

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype6-dev libx11-dev \
            libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev libgl1-mesa-dev \
            libfontconfig1-dev libcurl4-openssl-dev

      - name: Configure
        shell: bash
        run: |
          SDK="${GITHUB_WORKSPACE//\\//}/vst2sdk"
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_VST2=ON -DVST2_SDK_PATH="$SDK" -DJUCE_TAG=7.0.12

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Stage files
        shell: bash
        run: bash scripts/package.sh "${{ matrix.name }}"

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/stage/* -DestinationPath dist/GridARV-VST2-Windows.zip

      - name: Zip (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: cd dist/stage && zip -r -y ../GridARV-VST2-${{ matrix.name }}.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: GridARV-VST2-${{ matrix.name }}
          path: dist/*.zip
