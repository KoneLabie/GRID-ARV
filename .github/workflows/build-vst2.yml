name: Build plugins (VST2 optional)

# VST2 cannot be redistributed by Steinberg's current license, so the SDK is NOT part of this repo.
# Leave build_vst2 disabled for a normal JUCE 8 VST3 / standalone build.
# Enable it only in a private copy that includes your licensed SDK at vst2sdk/.

on:
  workflow_dispatch:
    inputs:
      build_vst2:
        description: "Also build the VST2 format (requires a licensed SDK under vst2sdk/)"
        type: boolean
        required: true
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-22.04
            name: Linux
    runs-on: ${{ matrix.os }}
    env:
      BUILD_VST2: ${{ inputs.build_vst2 }}
    steps:
      - uses: actions/checkout@v6

      - name: Source smoke tests
        run: python tests/verify_source_wiring.py

      - name: Check VST2 SDK
        if: inputs.build_vst2
        shell: bash
        run: |
          if [ ! -f vst2sdk/pluginterfaces/vst2.x/aeffect.h ]; then
            echo "::error::VST2 was enabled, but vst2sdk/pluginterfaces/vst2.x/aeffect.h was not found. Use a private repository copy with your licensed Steinberg SDK, or rerun with Build VST2 disabled."
            exit 1
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype6-dev libx11-dev \
            libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev libgl1-mesa-dev \
            libfontconfig1-dev libcurl4-openssl-dev

      - name: Configure
        shell: bash
        run: |
          if [[ "$BUILD_VST2" == "true" ]]; then
            SDK="${GITHUB_WORKSPACE//\\//}/vst2sdk"
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_VST2=ON \
              -DVST2_SDK_PATH="$SDK" -DJUCE_TAG=7.0.12
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_VST2=OFF -DJUCE_TAG=8.0.4
          fi

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Stage files
        shell: bash
        run: bash scripts/package.sh "${{ matrix.name }}"

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $flavor = if ($env:BUILD_VST2 -eq "true") { "VST2" } else { "Standard" }
          Compress-Archive -Path dist/stage/* -DestinationPath "dist/GridARV-$flavor-Windows.zip"

      - name: Zip (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$BUILD_VST2" == "true" ]]; then FLAVOR=VST2; else FLAVOR=Standard; fi
          cd dist/stage && zip -r -y "../GridARV-${FLAVOR}-${{ matrix.name }}.zip" .

      - uses: actions/upload-artifact@v7
        with:
          name: GridARV-${{ inputs.build_vst2 && 'VST2' || 'Standard' }}-${{ matrix.name }}
          path: dist/*.zip
