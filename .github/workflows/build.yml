name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-22.04
            name: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype6-dev libx11-dev \
            libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev libgl1-mesa-dev \
            libfontconfig1-dev libcurl4-openssl-dev

      - name: Source and installer smoke tests
        shell: bash
        run: |
          python tests/verify_source_wiring.py
          python tests/verify_installer_packaging.py

      - name: Linux installer integration test
        if: runner.os == 'Linux'
        shell: bash
        run: python tests/verify_linux_installer.py

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Stage files
        shell: bash
        run: bash scripts/package.sh "${{ matrix.name }}"

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows menu installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build_windows_installer.ps1

      - name: Build macOS component installer
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/build_macos_pkg.sh

      - name: Build Linux self-contained installer
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/build_linux_run.sh

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/stage/* -DestinationPath dist/GridARV-Windows.zip

      - name: Zip (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: cd dist/stage && zip -r -y ../GridARV-${{ matrix.name }}.zip .

      - uses: actions/upload-artifact@v7
        with:
          name: GridARV-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/GridARV-Installer-*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.zip
            artifacts/GridARV-Installer-*
